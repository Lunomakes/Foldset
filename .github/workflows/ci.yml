name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    # The app uses the macOS 26 SDK (ToolbarSpacer), so older runner images cannot build it.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version
      - name: Test, build and package
        run: zsh scripts/ci.sh
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Foldset-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/Release/
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: dotnet --info
      - name: Core tests
        run: dotnet run --project windows/Foldset.Core.Tests -c Release
      - name: Build and package
        shell: pwsh
        run: |
          dotnet publish windows/Foldset.App -c Release -r win-x64 -p:Platform=x64 -o output/windows/Foldset
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force output/Release | Out-Null
          Compress-Archive -Path output/windows/Foldset -DestinationPath output/Release/Foldset-windows-x64.zip -Force
          $hash = (Get-FileHash output/Release/Foldset-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Foldset-windows-x64.zip" | Out-File -Encoding ascii output/Release/Foldset-windows-x64.zip.sha256
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Foldset-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/Release/
          retention-days: 14
